<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="2048" viewBox="0 0 1024 2048" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="shade"><stop stop-color="#243140"/><stop offset=".45" stop-color="#121923"/><stop offset="1" stop-color="#070b12"/></radialGradient>
<radialGradient id="mist"><stop stop-color="#a3b4d4" stop-opacity=".30"/><stop offset=".35" stop-color="#73899e" stop-opacity=".17"/><stop offset="1" stop-color="#657f96" stop-opacity="0"/></radialGradient>
<radialGradient id="mist2"><stop stop-color="#a0b0c9" stop-opacity=".19"/><stop offset=".65" stop-color="#7d93ac" stop-opacity=".09"/><stop offset="1" stop-color="#a0b0c9" stop-opacity="0"/></radialGradient>
<filter id="vapor" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
