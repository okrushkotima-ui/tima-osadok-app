name: Build RITM Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'sounds/**'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out RITM
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Create native Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('icons/icon-512.png').convert('RGBA').save('icons/app.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build Windows setup exe
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
        run: npm run build:win

      - name: Preserve setup installer
        uses: actions/upload-artifact@v4
        with:
          name: RITM-Windows-Setup
          path: dist/RITM-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "РИТМ для Windows" --notes "Актуальный установщик РИТМ для Windows 10/11 (x64). Без цифровой подписи: SmartScreen может показать предупреждение." --prerelease
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $setup = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer not found" }
          gh release upload $tag $setup.FullName --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
