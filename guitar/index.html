<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#224b3e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Гитара с нуля · Саша</title><style>
:root{color-scheme:light dark;--bg:#f6f4ed;--card:#fffef9;--ink:#243b32;--muted:#727c73;--line:#dce1d7;--green:#285642;--soft:#e7eddf;--gold:#c5a45d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:26px 22px 120px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{letter-spacing:2px;font-size:11px;font-weight:800}.cloud{border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:11px}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.12;letter-spacing:-1px}h1{font-size:43px;margin:14px 0 18px}h2{font-size:30px;margin:26px 0 18px}h3{font-size:19px;margin:0 0 8px}p{margin:10px 0}small,.muted{color:var(--muted)}button,input,textarea,select{font:inherit}button{min-height:48px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:12px 17px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:transparent}button.wide{width:100%;display:block;margin:10px 0}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.row>*{min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);padding:20px;border-radius:23px;margin:14px 0}.tint{background:var(--soft);border:0}.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.pill{padding:5px 12px;background:var(--soft);border-radius:30px;font-size:12px}.track{height:5px;border-radius:10px;background:var(--line);overflow:hidden;margin:18px 0}.track i{display:block;background:var(--green);height:100%}.lesson{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.lesson b{font-size:12px;background:var(--soft);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}.lesson span{flex:1}.lesson:last-child{border:0}.bigtime{font:76px/1.3 Georgia,serif;font-variant-numeric:tabular-nums;text-align:center;margin:20px 0}.diagram{display:block;margin:10px auto;width:100%;max-width:190px;height:220px;color:var(--ink)}nav{position:fixed;bottom:0;left:0;right:0;z-index:4;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}nav button{width:160px;max-width:25%;border:0;background:none;padding:8px 3px;border-radius:12px;font-size:11px}nav button.active{background:var(--soft);color:var(--green)}nav em{display:block;font-size:21px;font-style:normal}.full{grid-column:1/-1}textarea,input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);max-width:100%}textarea{width:100%;min-height:180px}input[type=range]{width:100%;accent-color:var(--green);min-height:48px}dialog{width:calc(100% - 28px);max-width:500px;max-height:90dvh;overflow:auto;background:var(--bg);color:var(--ink);border:0;border-radius:26px;padding:23px}dialog::backdrop{background:#10291dc0}.beat{display:flex;gap:10px;justify-content:center;margin:20px 0}.beat span{border:1px solid var(--line);border-radius:50%;width:48px;height:48px;display:grid;place-items:center}.on{background:var(--green)!important;color:white!important}.arrows{display:grid;grid-template-columns:repeat(8,1fr);text-align:center;gap:2px}.arrows b{font-size:25px;border-radius:8px;min-height:48px;display:grid;place-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border-radius:8px;background:var(--line);font-size:12px;display:grid;place-items:center}.day.done30{background:#326047;color:white}.day.done10{background:#e2bc65;color:#302b1e}.day.today{outline:2px solid var(--ink);outline-offset:1px}.songtext{font-size:20px;line-height:2.4;white-space:pre-wrap;overflow-wrap:anywhere;max-height:55dvh;overflow:auto}.chordlink{padding:3px 7px;min-height:48px;border-radius:8px;color:var(--green);font-weight:bold}.notice{padding:12px 16px;border-left:3px solid var(--gold);background:var(--soft);border-radius:8px}.stats{display:flex;gap:20px;justify-content:space-between}.stats strong{font:32px Georgia;display:block}details{margin:16px 0}summary{cursor:pointer;min-height:48px;padding:10px 0}label{display:block}svg{overflow:visible}.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0}.check input{min-width:24px;height:24px;accent-color:var(--green)}.tiny{font-size:12px}#sync{font-size:11px;margin-top:12px;color:var(--muted)}.switchbutton{min-height:170px;font-size:27px;width:100%;background:var(--green);color:white}.rating{display:flex;gap:8px}.rating button{flex:1;padding:8px}.timerbar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:1}@media(prefers-color-scheme:dark){:root{--bg:#17251f;--card:#20342a;--ink:#ecefdf;--muted:#aab8ab;--line:#3d5144;--green:#416d52;--soft:#2b4032;--gold:#cfb272}}@media(min-width:650px){h1{font-size:58px}.homehero{padding:12px 0}.grid .card{margin:0}.grid{gap:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><main><header><div class="brand">ГИТАРА С НУЛЯ</div><button class="cloud" onclick="openMetro()" aria-label="Открыть метроном">◷ метроном</button></header><div id="app"></div><div id="sync" role="status"></div></main><nav id="nav"></nav><dialog id="modal"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const START='2026-10-27',dayms=86400000,iso=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow'}).format(d),today=iso(new Date()),day=Math.max(1,Math.min(66,Math.floor((Date.parse(today)-Date.parse(START))/dayms)+1));
const W=[['27.10–02.11','Три первых аккорда','Посадка, настройка, Em, Am, C. Четыре удара вниз на аккорд.',50,'Em, Am и C звучат чисто'],['03.11–09.11','Собираем круг','Добавь D. Играй Am → C → Em → D. Считай смены каждый день.',55,'30 смен на каждой из четырёх пар'],['10.11–16.11','Ловим ритм','Бой 1, затем 2. Играй и проговаривай слова.',65,'Меняю аккорды, не останавливая бой'],['17.11–25.11','Первая целая песня','Бой с глушением. Пройди песню целиком и сними видео.',70,'Видео: вся песня без остановок'],['26.11–02.12','Готовим голос','Учи текст наизусть, пой под запись. В обычном занятии 15 минут оставь гитаре.',60,'Текст наизусть без подсказки'],['03.12–09.12','Соединяем голос и руки','Пой куплет с одним ударом вниз на аккорд.',60,'Куплет сыгран и спет без сбоев'],['10.12–16.12','Поём под бой','Пение с боем 1–2. Начни с одного куплета.',65,'Куплет с полным боем'],['17.12–24.12','От начала до конца','Играй и пой всю песню, постепенно приближаясь к записи.',70,'Вся песня с пением, не более двух сбоев'],['25.12–31.12','Твоя первая песня','Спокойные прогоны. Запиши финальное видео: гитара и голос.',70,'Финальное видео: играю и пою целиком']];
const wi=day<=21?Math.floor((day-1)/7):day<=30?3:day<=51?4+Math.floor((day-31)/7):day<=59?7:8;
let state={sessions:{},switches:[],checks:{},song:'',bpm:50,repeats:2,volume:.35},tab='today',loaded=false,saveChain=Promise.resolve(),syncError=false;
let local;try{local=JSON.parse(localStorage.getItem('guitar-zero-v1'));if(local)state={...state,...local}}catch{};
function save(){try{localStorage.setItem('guitar-zero-v1',JSON.stringify(state));$('#sync').textContent='Сохранено на этом устройстве';syncError=false}catch{syncError=true;$('#sync').textContent='Браузер не дал сохранить данные. Скачай копию в разделе «Прогресс».'}}
function load(){loaded=true;$('#sync').textContent='Прогресс хранится на этом устройстве';render()}
const CH={Em:{f:[0,2,2,0,0,0],p:[0,2,3,0,0,0],text:'Средний: 5-я струна, 2-й лад. Безымянный: 4-я струна, 2-й лад.',strings:'Все 6 струн',error:'Палец может задевать соседнюю струну.'},Am:{f:[-1,0,2,2,1,0],p:[0,0,2,3,1,0],text:'Указательный: 2-я струна, 1-й лад. Средний: 4-я, 2-й лад. Безымянный: 3-я, 2-й лад.',strings:'С 5-й по 1-ю',error:'Не задевай самую толстую, 6-ю струну.'},C:{f:[-1,3,2,0,1,0],p:[0,3,2,0,1,0],text:'Безымянный: 5-я струна, 3-й лад. Средний: 4-я, 2-й лад. Указательный: 2-я, 1-й лад.',strings:'С 5-й по 1-ю',error:'Не прижимай открытую 3-ю струну боком пальца.'},D:{f:[-1,-1,0,2,3,2],p:[0,0,0,1,3,2],text:'Указательный: 3-я струна, 2-й лад. Безымянный: 2-я, 3-й лад. Средний: 1-я, 2-й лад.',strings:'С 4-й по 1-ю',error:'Не задевай 5-ю и 6-ю струны.'}};
function diagram(name,exercise=false){let c=CH[name]||{f:[1,2,3,4,-1,-1],p:[1,2,3,4,0,0]};return '<svg class="diagram" viewBox="0 0 180 205" role="img" aria-label="Схема '+esc(name)+'"><text x="90" y="15" text-anchor="middle" fill="currentColor" font-size="19">'+esc(name)+'</text>'+Array.from({length:5},(_,i)=>'<path d="M30 '+(50+i*33)+'H150" stroke="currentColor" stroke-width="'+(i?1:4)+'"/>').join('')+c.f.map((f,i)=>'<path d="M'+(30+i*24)+' 50V182" stroke="currentColor" stroke-width="'+(1.8-i*.18)+'"/><text x="'+(30+i*24)+'" y="39" text-anchor="middle" fill="currentColor" font-size="13">'+(f<0?'×':f===0?'○':'')+'</text><text x="'+(30+i*24)+'" y="201" text-anchor="middle" fill="currentColor" font-size="11">'+(6-i)+'</text>'+(f>0?'<circle cx="'+(30+i*24)+'" cy="'+(50+(f-.5)*33)+'" r="11" fill="var(--green)"/><text x="'+(30+i*24)+'" y="'+(54+(f-.5)*33)+'" text-anchor="middle" fill="white" font-size="12">'+c.p[i]+'</text>':'')).join('')+'</svg>'}
function chordCard(n){return '<h2>'+n+'</h2>'+diagram(n)+'<p>'+CH[n].text+'</p><p class="pill">'+CH[n].strings+'</p><button class="wide primary" onclick="playChord(\''+n+'\')">▷ Послушать</button><p class="notice">'+CH[n].error+'</p>'}
function modal(html){if(exerciseClock){clearInterval(exerciseClock);exerciseClock=null}$('#modal').innerHTML='<div class="row between"><span class="eyebrow">Гитара с нуля</span><button onclick="closeModal()" aria-label="Закрыть">✕</button></div>'+html;$('#modal').showModal()}
function closeModal(){$('#modal').close();if(switchRunning)finishSwitch();if(exerciseClock){clearInterval(exerciseClock);exerciseClock=null}}
function showChord(n){modal(chordCard(n))}
let audio,metro=false,metroLoop,nextBeat=0,beatIndex=0,bpm=W[wi][3],wake,scheduled=[],songBeat=0;
function sound(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}
function tone(f,t,d=.12,g=.12,type='sine'){let a=sound(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+.03);scheduled.push(o);o.onended=()=>{scheduled=scheduled.filter(x=>x!==o)}}
function beep(double=false){const a=sound();tone(740,a.currentTime,.1,.18);if(double)tone(990,a.currentTime+.2,.16,.18)}
const freqs=[82.4069,110,146.8324,195.9977,246.9417,329.6276];
function playChord(n){const a=sound();CH[n].f.forEach((f,i)=>{if(f>=0)tone(freqs[i]*Math.pow(2,f/12),a.currentTime+i*.07,1.7,.12,'triangle')})}
function setBpm(n){bpm=Math.max(40,Math.min(140,Math.round(n)));$('#bpmValue')&&($('#bpmValue').textContent=bpm);$('#bpmRange')&&($('#bpmRange').value=bpm)}
function stopMetro(){metro=false;clearInterval(metroLoop);scheduled.forEach(o=>{try{o.stop()}catch{}});scheduled=[];document.querySelectorAll('.on').forEach(n=>n.classList.remove('on'));$('#metroToggle')&&($('#metroToggle').textContent='▶ Старт')}
function startMetro(){sound();metro=true;nextBeat=audio.currentTime+.04;beatIndex=0;metroLoop=setInterval(schedule,25);schedule();$('#metroToggle')&&($('#metroToggle').textContent='Ⅱ Стоп')}
function toggleMetro(){metro?stopMetro():startMetro()}
function schedule(){while(nextBeat<audio.currentTime+.12){const b=beatIndex++,t=nextBeat; tone(b%4===0?1100:720,t,.045,state.volume*.35);setTimeout(()=>{if(!metro)return;document.querySelectorAll('[data-beat]').forEach(e=>e.classList.toggle('on',+e.dataset.beat===b%4));document.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('on',+e.dataset.step===(b%4)*2));songBeat=b;highlightSong();},Math.max(0,(t-audio.currentTime)*1000));setTimeout(()=>{if(metro)document.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('on',+e.dataset.step===(b%4)*2+1))},Math.max(0,(t-audio.currentTime+30/bpm)*1000));nextBeat+=60/bpm}}
let taps=[];
function tap(){let now=performance.now();if(taps.length&&now-taps.at(-1)>2200)taps=[];taps.push(now);if(taps.length>8)taps.shift();$('#tapLabel').textContent=taps.length+'/8 нажатий';if(taps.length===8){state.recordBpm=Math.max(40,Math.min(140,Math.round(420000/(taps[7]-taps[0]))));setBpm(state.recordBpm);save();$('#tapLabel').textContent='Сохранено: '+state.recordBpm+' уд./мин'}}
function openMetro(){modal('<h2>Держим ритм</h2><div class="bigtime" id="bpmValue">'+bpm+'</div><div class="row"><button onclick="setBpm(bpm-5)">−5</button><input id="bpmRange" aria-label="Темп" type="range" min="40" max="140" value="'+bpm+'" oninput="setBpm(this.value)"><button onclick="setBpm(bpm+5)">+5</button></div><p class="muted">Ударов в минуту · первая доля выше</p><div class="beat">'+[0,1,2,3].map(i=>'<span data-beat="'+i+'">'+(i+1)+'</span>').join('')+'</div><button id="metroToggle" class="primary wide" onclick="toggleMetro()">'+(metro?'Ⅱ Стоп':'▶ Старт')+'</button><label>Громкость<input type="range" aria-label="Громкость метронома" min="0" max="1" step=".05" value="'+state.volume+'" oninput="state.volume=+this.value" onchange="save()"></label><hr><button class="wide" onclick="tap()">Отстучать темп записи</button><p id="tapLabel" class="muted">Под запись нажми 8 раз в ритм. '+(state.recordBpm?'Сохранено: '+state.recordBpm:'Темп пока не измерен')+'</p>')}
function streak(){let count=0,d=new Date(today+'T12:00:00Z');if(!state.sessions[iso(d)]?.completed)d.setUTCDate(d.getUTCDate()-1);while(state.sessions[iso(d)]?.completed){count++;d.setUTCDate(d.getUTCDate()-1)}return count}
function navigate(t){if(training&&t!=='training'){modal('<h2>Тренировка идёт</h2><p>Можно продолжить или завершить без отметки о выполнении.</p><button class="wide primary" onclick="closeModal()">Продолжить</button><button class="wide" onclick="cancelTraining();closeModal();navigate(\''+t+'\')">Выйти из тренировки</button>');return}tab=t;render();window.scrollTo(0,0)}
function render(){const names=[['today','◷','Сегодня'],['chords','♧','Аккорды и бой'],['song','♫','Песня'],['progress','▥','Прогресс']];$('#nav').innerHTML=names.map(([key,icon,name])=>'<button class="'+(tab===key?'active':'')+'" onclick="navigate(\''+key+'\')"><em>'+icon+'</em>'+name+'</button>').join('');if(tab==='training'){renderTraining();return}$('#app').innerHTML=tab==='today'?home():tab==='chords'?chordsPage():tab==='song'?songPage():progressPage();}
function home(){const yesterday=new Date(Date.parse(today)-dayms);return '<div class="row between"><span class="eyebrow">День '+day+' из 66</span><span class="pill">'+streak()+' дней подряд</span></div><div class="homehero"><h1>Саша,<br>пора играть.</h1><p class="muted">Каждый день немного ближе к первой песне.</p></div><div class="track"><i style="width:'+day/66*100+'%"></i></div><div class="row between"><span class="tiny">27 октября</span><span class="tiny">31 декабря</span></div><div class="card tint"><div class="eyebrow">Неделя '+(wi+1)+' · '+W[wi][0]+'</div><h2 style="margin:10px 0">'+W[wi][1]+'</h2><p>'+W[wi][2]+'</p></div>'+(day>1&&!state.sessions[iso(yesterday)]?'<p class="notice">Вчера пропуск. Сегодня хотя бы 10 минут.</p>':'')+(state.sessions[today]?'<p class="notice">Сегодня уже занимался · '+state.sessions[today].minutes+' мин. Можно поиграть ещё.</p>':'')+'<button class="wide primary" onclick="begin(30)">▶ Нормальный день · 30 мин</button><button class="wide" onclick="begin(10)">Тяжёлый день · 10 мин</button><h2>Сегодня</h2>'+['Настройка гитары|2 / 1 мин','Разминка рук|3 / 1 мин','Аккорды и смены|10 / 4 мин','Бой и песня|12 / 4 мин','Свободная игра|3 / 0 мин'].map((x,i)=>'<div class="lesson"><b>0'+(i+1)+'</b><span>'+x.split('|')[0]+'</span><small>'+x.split('|')[1]+'</small></div>').join('')+'<p class="tiny muted">Время: обычный / тяжёлый день. Оба режима сохраняют серию.</p><details><summary>Как сесть и держать руки</summary>'+posture()+'</details><p class="tiny muted">25 ноября — играешь песню. 31 декабря — играешь и поёшь.</p>'}
function posture(){return '<svg viewBox="0 0 300 160" role="img" aria-label="Посадка с гитарой на левой ноге" style="width:100%;height:160px"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><circle cx="110" cy="25" r="17"/><path d="M110 45V100L65 118V150M110 100L150 110V150M85 110H140M85 110V155M108 57L155 85L225 35M110 65L94 90"/><ellipse cx="145" cy="90" rx="28" ry="35" transform="rotate(35 145 90)" fill="var(--soft)"/><path d="M155 70L225 25L233 38L168 85"/><circle cx="149" cy="85" r="8"/></g><text x="195" y="125" fill="currentColor" font-size="12">Гриф чуть вверх</text></svg><p>Сядь ровно. Гитара на левой ноге, под левую стопу — устойчивая подставка.</p><p>Большой палец за грифом. Остальные — кончиками, сразу слева от металлической полоски лада.</p><p class="notice">Не играй через острую боль в кисти: остановись и дай руке отдохнуть. Нагрузку на подушечки увеличивай постепенно.</p>'}
function chordsPage(){return '<div class="eyebrow">Твоя база</div><h1>Четыре аккорда.<br>Одна песня.</h1><p class="muted">1 — указательный, 2 — средний, 3 — безымянный, 4 — мизинец. Струна 1 самая тонкая; 6 самая толстая.</p><div class="grid">'+Object.keys(CH).map(n=>'<button class="card" onclick="showChord(\''+n+'\')"><h3>'+n+'</h3>'+diagram(n)+'<small>'+CH[n].strings+'</small></button>').join('')+'</div><p class="notice">Am ↔ C: указательный и средний остаются на месте. Переставь только безымянный.</p><button class="wide primary" onclick="switchScreen()">Минута смен →</button><h2>Бой по шагам</h2>'+[1,2,3].map(level=>'<div class="card"><h3>Уровень '+level+(level>(wi<2?1:wi===2?2:3)?' · откроется позже':'')+'</h3>'+strum(level)+'<p>'+['','Четыре движения вниз: на каждый счёт.','Вниз на «раз», вверх на «и». Повторяй на «два-и».','На «два» — вниз и сразу глуши ребром ладони у подставки.'][level]+'</p></div>').join('')+'<p>↓ Вниз — ногтем указательного. ↑ Вверх — подушечкой по тонким струнам. ⇣ Вниз, затем коснись струн ребром ладони у подставки.</p><button class="wide" onclick="openMetro()">Включить метроном</button><h2>Разминка</h2>'+exercises.map((e,i)=>'<button class="wide" onclick="showExercise('+i+')">'+e[0]+' · '+e[2]+' с</button>').join('')+'<button class="wide" onclick="modal(\'<h2>Посадка и руки</h2>\'+posture())">Посадка и руки</button>'}

function repeatWeek(i){modal('<h2>Повторить неделю '+(i+1)+'</h2><p>'+W[i][2]+'</p><p>Календарь не сдвигается. Используй эти задания сегодня; темп — '+W[i][3]+'.</p><button class="primary wide" onclick="closeModal();beginRepeat('+i+')">Начать повторение · 30 мин</button>')}
let repeatIndex=null;function beginRepeat(i){repeatIndex=i;begin(30)}
function switchChart(){if(!state.switches.length)return '<p class="muted">Запиши первую минуту смен — здесь появится график.</p>';return '<div class="card">'+PAIRS.map(p=>{let data=state.switches.filter(x=>x.pair===p).slice(-14);if(!data.length)return '';const max=Math.max(35,...data.map(x=>x.count));return '<h3>'+p+'</h3><svg viewBox="0 0 300 100" style="width:100%;height:130px" role="img" aria-label="Результаты '+p+'"><path d="M0 '+(90-30/max*80)+'H300" stroke="var(--gold)" stroke-dasharray="4"/><text x="265" y="'+(85-30/max*80)+'" font-size="9" fill="currentColor">цель 30</text>'+data.map((x,i)=>'<rect x="'+(i*260/data.length)+'" y="'+(90-x.count/max*80)+'" width="'+Math.min(20,220/data.length)+'" height="'+x.count/max*80+'" fill="var(--green)"/><text x="'+(i*260/data.length)+'" y="'+(85-x.count/max*80)+'" font-size="10" fill="currentColor">'+x.count+'</text>').join('')+'</svg><p class="tiny muted">'+data.map(x=>x.date.slice(5)+': '+x.count).join(' · ')+'</p>'}).join('')+'</div>'}
async function importProgress(input){const file=input.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error();let data=JSON.parse(await file.text());if(!data||typeof data.sessions!=='object'||!Array.isArray(data.switches)||typeof data.song!=='string'||typeof data.checks!=='object')throw Error();for(const [date,session] of Object.entries(data.sessions)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(session.minutes)||session.minutes<0)throw Error()}if(!data.switches.every(x=>typeof x.date==='string'&&PAIRS.includes(x.pair)&&Number.isFinite(x.count)&&x.count>=0&&x.count<=500))throw Error();state={...state,sessions:{...state.sessions,...data.sessions},switches:[...state.switches,...data.switches].filter((x,i,a)=>a.findIndex(y=>y.date===x.date&&y.pair===x.pair&&y.count===x.count)===i),checks:{...state.checks,...data.checks},song:data.song||state.song,repeats:[1,2,3,4,8].includes(data.repeats)?data.repeats:2,recordBpm:Math.max(40,Math.min(140,+data.recordBpm||50)),volume:Math.max(0,Math.min(1,+data.volume||.35))};save();render();modal('<h2>Копия восстановлена</h2><p>Занятия и результаты смен добавлены к твоему прогрессу.</p>')}catch{modal('<h2>Не удалось прочитать копию</h2><p>Выбери JSON-файл, скачанный из этого приложения. Текущие данные сохранены.</p>')}input.value=''}
function exportProgress(){let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='guitar-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
render();load();
</script></html>
