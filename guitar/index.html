const W=[['27.10–02.11','Три первых аккорда','Посадка, настройка, Em, Am, C. Четыре удара вниз на аккорд.',50,'Em, Am и C звучат чисто'],['03.11–09.11','Собираем круг','Добавь D. Играй Am → C → Em → D. Считай смены каждый день.',55,'30 смен на каждой из четырёх пар'],['10.11–16.11','Ловим ритм','Бой 1, затем 2. Играй и проговаривай слова.',65,'Меняю аккорды, не останавливая бой'],['17.11–25.11','Первая целая песня','Бой с глушением. Пройди песню целиком и сними видео.',70,'Видео: вся песня без остановок'],['26.11–02.12','Готовим голос','Учи текст наизусть, пой под запись. В обычном занятии 15 минут оставь гитаре.',60,'Текст наизусть без подсказки'],['03.12–09.12','Соединяем голос и руки','Пой куплет с одним ударом вниз на аккорд.',60,'Куплет сыгран и спет без сбоев'],['10.12–16.12','Поём под бой','Пение с боем 1–2. Начни с одного куплета.',65,'Куплет с полным боем'],['17.12–24.12','От начала до конца','Играй и пой всю песню, постепенно приближаясь к записи.',70,'Вся песня с пением, не более двух сбоев'],['25.12–31.12','Твоя первая песня','Спокойные прогоны. Запиши финальное видео: гитара и голос.',70,'Финальное видео: играю и пою целиком']];

function diagram(name,exercise=false){let c=CH[name]||{f:[1,2,3,4,-1,-1],p:[1,2,3,4,0,0]};return '<svg class="diagram" viewBox="0 0 180 205" role="img" aria-label="Схема '+esc(name)+'"><text x="90" y="15" text-anchor="middle" fill="currentColor" font-size="19">'+esc(name)+'</text>'+Array.from({length:5},(_,i)=>'<path d="M30 '+(50+i*33)+'H150" stroke="currentColor" stroke-width="'+(i?1:4)+'"/>').join('')+c.f.map((f,i)=>'<path d="M'+(30+i*24)+' 50V182" stroke="currentColor" stroke-width="'+(1.8-i*.18)+'"/><text x="'+(30+i*24)+'" y="39" text-anchor="middle" fill="currentColor" font-size="13">'+(f<0?'×':f===0?'○':'')+'</text><text x="'+(30+i*24)+'" y="201" text-anchor="middle" fill="currentColor" font-size="11">'+(6-i)+'</text>'+(f>0?'<circle cx="'+(30+i*24)+'" cy="'+(50+(f-.5)*33)+'" r="11" fill="var(--green)"/><text x="'+(30+i*24)+'" y="'+(54+(f-.5)*33)+'" text-anchor="middle" fill="white" font-size="12">'+c.p[i]+'</text>':'')).join('')+'</svg>'}

let audio,metro=false,metroLoop,nextBeat=0,beatIndex=0,bpm=W[wi][3],wake,scheduled=[],songBeat=0;
function sound(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}
function tone(f,t,d=.12,g=.12,type='sine'){let a=sound(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+.03);scheduled.push(o);o.onended=()=>{scheduled=scheduled.filter(x=>x!==o)}}

function schedule(){while(nextBeat<audio.currentTime+.12){const b=beatIndex++,t=nextBeat; tone(b%4===0?1100:720,t,.045,state.volume*.35);setTimeout(()=>{if(!metro)return;document.querySelectorAll('[data-beat]').forEach(e=>e.classList.toggle('on',+e.dataset.beat===b%4));document.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('on',+e.dataset.step===(b%4)*2));songBeat=b;highlightSong();},Math.max(0,(t-audio.currentTime)*1000));setTimeout(()=>{if(metro)document.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('on',+e.dataset.step===(b%4)*2+1))},Math.max(0,(t-audio.currentTime+30/bpm)*1000));nextBeat+=60/bpm}}

function streak(){let count=0,d=new Date(today+'T12:00:00Z');if(!state.sessions[iso(d)]?.completed)d.setUTCDate(d.getUTCDate()-1);while(state.sessions[iso(d)]?.completed){count++;d.setUTCDate(d.getUTCDate()-1)}return count}

function cancelTraining(){repeatIndex=null;clearInterval(trainingLoop);stopMetro();wake?.release();training=null}
let pendingSession;
function finishTraining(){pendingSession={mode:training.mode,elapsed:training.elapsed,date:training.sessionDate};cancelTraining();tab='today';$('#app').innerHTML='<div class="eyebrow">Занятие завершено</div><h1>Ещё на шаг<br>ближе.</h1><p>Время практики: '+clock(pendingSession.elapsed)+'.</p>'+(pendingSession.elapsed<pendingSession.mode*60-2?'<p class="notice">Часть времени пропущена. В журнал запишем фактические минуты; серия засчитывается от 10 минут.</p>':'')+'<h2>Как прошло?</h2><div class="rating">'+[1,2,3,4,5].map(n=>'<button onclick="document.querySelectorAll(\'.rating button\').forEach(x=>x.classList.remove(\'on\'));this.classList.add(\'on\');pendingSession.rating='+n+'">'+n+'</button>').join('')+'</div><label style="margin-top:20px">Заметка <textarea id="sessionNote" placeholder="Необязательно: что получилось?" style="min-height:90px"></textarea></label><button class="primary wide" onclick="saveSession()">Сохранить занятие</button>'}
function saveSession(){const p=pendingSession,mins=Math.floor(p.elapsed/60);if(mins<10){modal('<h2>Пока меньше 10 минут</h2><p>Результат не потеряется: заметка останется в журнале. Для календаря и серии нужно хотя бы 10 минут.</p><button class="wide primary" onclick="commitSession()">Записать '+mins+' мин</button>')}else commitSession()}
function commitSession(){let p=pendingSession,prev=state.sessions[p.date],mins=Math.floor(p.elapsed/60),note=$('#sessionNote')?.value||'';state.sessions[p.date]={minutes:(prev?.minutes||0)+mins,rating:p.rating||null,note:note,completed:(prev?.completed||false)||mins>=10};pendingSession=null;save();if($('#modal').open)closeModal();tab='progress';render()}
const PAIRS=['Am↔C','C↔Em','Em↔D','D↔Am'];let switchRunning=false,switchPair=0,switchCount=0,switchEnd,switchLoop;
function switchScreen(){modal('<h2>Минута смен</h2><label>Пара аккордов<select id="pair" onchange="switchPair=+this.value;showPair()">'+PAIRS.map((p,i)=>'<option value="'+i+'" '+(switchPair===i?'selected':'')+'>'+p+'</option>').join('')+'</select></label><div id="pairDiagrams"></div><p class="muted">Одна смена — переход на следующий аккорд. Цель: 30 за минуту.</p><div class="bigtime" id="switchTime">01:00</div><button class="switchbutton" id="countSwitch" onclick="switchCount++;this.textContent=switchCount" disabled>0</button><button id="switchStart" class="wide" onclick="startSwitch()">Старт · 60 секунд</button><div id="switchResult"></div>');showPair()}
function showPair(){$('#pairDiagrams').innerHTML='<div class="grid">'+PAIRS[switchPair].split('↔').map(diagram).join('')+'</div>'+(switchPair===0?'<p>Пальцы 1 и 2 остаются на месте. Двигается только 3-й.</p>':'')}
function startSwitch(){if(switchRunning)return;switchCount=0;switchRunning=true;switchEnd=performance.now()+60000;$('#countSwitch').disabled=false;$('#countSwitch').textContent=0;$('#pair').disabled=true;$('#switchStart').disabled=true;switchLoop=setInterval(()=>{let n=Math.max(0,Math.ceil((switchEnd-performance.now())/1000));$('#switchTime').textContent=clock(n);if(!n){finishSwitch();beep(true);$('#switchResult').innerHTML='<label>Сколько смен получилось?<input id="switchNumber" type="number" min="0" max="500" value="'+switchCount+'"></label><button class="primary wide" onclick="storeSwitch()">Сохранить результат</button>'}},100)}
function finishSwitch(){switchRunning=false;clearInterval(switchLoop);if($('#countSwitch'))$('#countSwitch').disabled=true}
function storeSwitch(){let count=+$('#switchNumber').value;if(!Number.isFinite(count)||count<0||count>500)return;state.switches.push({date:today,pair:PAIRS[switchPair],count:Math.floor(count)});save();closeModal()}
function saveSongInput(){state.song=$('#songInput').value;save();render()}
function songBody(){return state.song?'<div class="songtext" id="songText">'+esc(state.song).replace(/\b(Am|Em|C|D)\b/g,'<button class="chordlink" onclick="showChord(\'$1\')">$1</button>')+'</div>':'<p>Добавь свой текст с аккордами. Они станут кнопками — по нажатию откроется схема.</p>'}
let scrollLoop;
function songPage(){return '<div class="eyebrow">Твоя первая песня</div><h1>В сигаретном<br>дыму</h1><p class="muted">Версия Ислама Идигова · аккорды из твоего ТЗ</p><div class="row">'+['Am','C','Em','D'].map((n,i)=>'<button data-songchord="'+i+'" onclick="showChord(\''+n+'\')">'+n+'</button>').join('')+'</div><p class="tiny muted">Подсветка следует метроному. Число повторов уточни по записи.</p><label class="row">Повторов боя на аккорд<select onchange="state.repeats=+this.value;save()">'+[1,2,3,4,8].map(n=>'<option '+(state.repeats===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><div class="row" style="margin-top:15px"><button onclick="toggleMetro()">▶ / Ⅱ Ритм</button><button onclick="toggleScroll(this)">Автопрокрутка</button><button onclick="document.querySelector(\'#songText\')?.classList.toggle(\'onlychords\');setSongOnly(this)">Только аккорды</button></div><div class="card" id="songContainer">'+songBody()+'</div><details><summary>Добавить или изменить текст</summary><textarea id="songInput" placeholder="Вставь текст с аккордами Am, C, Em, D">'+esc(state.song)+'</textarea><button class="wide primary" onclick="saveSongInput()">Сохранить текст</button><p class="tiny muted">Скопируй нужный вариант с сайта аккордов. Полного текста в приложении пока нет.</p></details><p class="tiny muted">Темп записи: '+(state.recordBpm?state.recordBpm+' уд./мин':'ещё не измерен — открой метроном и отстучи 8 ударов')+'.</p>'}
function highlightSong(){document.querySelectorAll('[data-songchord]').forEach(e=>e.classList.toggle('on',+e.dataset.songchord===Math.floor(songBeat/(state.repeats*(wi<2?4:2)))%4))}
function setSongOnly(btn){let t=$('#songText');if(!t)return;if(t.dataset.only){t.dataset.only='';t.innerHTML=esc(state.song).replace(/\b(Am|Em|C|D)\b/g,'<button class="chordlink" onclick="showChord(\'$1\')">$1</button>');btn.textContent='Только аккорды'}else{t.dataset.only='1';t.innerHTML=(state.song.match(/\b(Am|Em|C|D)\b/g)||[]).map(n=>'<button class="chordlink" onclick="showChord(\''+n+'\')">'+n+'</button>').join(' → ');btn.textContent='Показать текст'}}
function toggleScroll(btn){if(scrollLoop){clearInterval(scrollLoop);scrollLoop=null;btn.textContent='Автопрокрутка';return}if(!$('#songText'))return;btn.textContent='Стоп прокрутки';scrollLoop=setInterval(()=>{let t=$('#songText');if(!t){clearInterval(scrollLoop);scrollLoop=null;return}t.scrollTop+=bpm/60*1.5},100)}
function progressPage(){let entries=Object.entries(state.sessions).filter(([,s])=>s.completed),total=Object.values(state.sessions).reduce((a,s)=>a+s.minutes,0);return '<div class="eyebrow">27 октября — 31 декабря</div><h1>Ты уже<br>продвинулся.</h1><div class="stats"><div><strong>'+streak()+'</strong><small>дней подряд</small></div><div><strong>'+entries.length+'</strong><small>занятий</small></div><div><strong>'+total+'</strong><small>минут</small></div></div><div class="card"><h3>Твой календарь</h3><p class="tiny muted">Зелёный ≥30 мин · жёлтый ≥10 мин · серый — нет занятия. День начинается по Москве.</p><div class="calendar">'+Array.from({length:66},(_,i)=>{let d=iso(new Date(Date.parse(START)+i*dayms)),s=state.sessions[d];return '<div class="day '+(s?.completed?(s.minutes>=30?'done30':'done10'):'')+' '+(d===today?'today':'')+'" title="'+d+(s?' · '+s.minutes+' мин':'')+'">'+Number(d.slice(-2))+'</div>'}).join('')+'</div><p class="tiny muted">Дни по порядку с 27 октября, без привязки к дням недели.</p></div><h2>Смены за минуту</h2>'+switchChart()+'<h2>Девять шагов</h2>'+W.map((w,i)=>'<div class="card"><div class="eyebrow">Неделя '+(i+1)+' · '+w[0]+'</div><h3>'+w[1]+'</h3><p>'+w[2]+'</p><label class="check"><input type="checkbox" '+(state.checks[i]?'checked':'')+' onchange="state.checks['+i+']=this.checked;save()"><span>'+w[4]+'</span></label>'+(!state.checks[i]&&i<wi?'<div class="row"><button onclick="repeatWeek('+i+')">Повторить неделю</button><button onclick="this.parentElement.innerHTML=\'<small>Продолжаем по календарю. К этому шагу можно вернуться.</small>\'">Идти дальше</button></div>':'')+'</div>').join('')+'<h2>Журнал</h2>'+(Object.entries(state.sessions).reverse().map(([d,s])=>'<div class="card"><b>'+d.split('-').reverse().join('.')+' · '+s.minutes+' мин</b><p>'+esc(s.note||'Практика на гитаре')+'</p><small>'+(s.rating?'Оценка: '+s.rating+'/5':'')+'</small></div>').join('')||'<p class="muted">Первая запись появится после занятия.</p>')+'<button class="wide" onclick="exportProgress()">Скачать копию прогресса</button><label class="card">Восстановить из копии<input type="file" accept="application/json,.json" onchange="importProgress(this)"></label><p class="tiny muted">На GitHub Pages данные хранятся в этом браузере. Скачивай копию перед очисткой данных или сменой телефона.</p>'}
function repeatWeek(i){modal('<h2>Повторить неделю '+(i+1)+'</h2><p>'+W[i][2]+'</p><p>Календарь не сдвигается. Используй эти задания сегодня; темп — '+W[i][3]+'.</p><button class="primary wide" onclick="closeModal();beginRepeat('+i+')">Начать повторение · 30 мин</button>')}
let repeatIndex=null;function beginRepeat(i){repeatIndex=i;begin(30)}
function switchChart(){if(!state.switches.length)return '<p class="muted">Запиши первую минуту смен — здесь появится график.</p>';return '<div class="card">'+PAIRS.map(p=>{let data=state.switches.filter(x=>x.pair===p).slice(-14);if(!data.length)return '';const max=Math.max(35,...data.map(x=>x.count));return '<h3>'+p+'</h3><svg viewBox="0 0 300 100" style="width:100%;height:130px" role="img" aria-label="Результаты '+p+'"><path d="M0 '+(90-30/max*80)+'H300" stroke="var(--gold)" stroke-dasharray="4"/><text x="265" y="'+(85-30/max*80)+'" font-size="9" fill="currentColor">цель 30</text>'+data.map((x,i)=>'<rect x="'+(i*260/data.length)+'" y="'+(90-x.count/max*80)+'" width="'+Math.min(20,220/data.length)+'" height="'+x.count/max*80+'" fill="var(--green)"/><text x="'+(i*260/data.length)+'" y="'+(85-x.count/max*80)+'" font-size="10" fill="currentColor">'+x.count+'</text>').join('')+'</svg><p class="tiny muted">'+data.map(x=>x.date.slice(5)+': '+x.count).join(' · ')+'</p>'}).join('')+'</div>'}
async function importProgress(input){const file=input.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error();let data=JSON.parse(await file.text());if(!data||typeof data.sessions!=='object'||!Array.isArray(data.switches)||typeof data.song!=='string'||typeof data.checks!=='object')throw Error();for(const [date,session] of Object.entries(data.sessions)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(session.minutes)||session.minutes<0)throw Error()}if(!data.switches.every(x=>typeof x.date==='string'&&PAIRS.includes(x.pair)&&Number.isFinite(x.count)&&x.count>=0&&x.count<=500))throw Error();state={...state,sessions:{...state.sessions,...data.sessions},switches:[...state.switches,...data.switches].filter((x,i,a)=>a.findIndex(y=>y.date===x.date&&y.pair===x.pair&&y.count===x.count)===i),checks:{...state.checks,...data.checks},song:data.song||state.song,repeats:[1,2,3,4,8].includes(data.repeats)?data.repeats:2,recordBpm:Math.max(40,Math.min(140,+data.recordBpm||50)),volume:Math.max(0,Math.min(1,+data.volume||.35))};save();render();modal('<h2>Копия восстановлена</h2><p>Занятия и результаты смен добавлены к твоему прогрессу.</p>')}catch{modal('<h2>Не удалось прочитать копию</h2><p>Выбери JSON-файл, скачанный из этого приложения. Текущие данные сохранены.</p>')}input.value=''}
function exportProgress(){let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='guitar-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
render();load();
</script></html>
