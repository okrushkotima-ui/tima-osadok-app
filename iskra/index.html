const cards=[{"category":"Текст","text":"Напиши припев из одной фразы, которую хочется повторять."},{"category":"Текст","text":"Начни песню со слов «Я помню…» и опиши один момент."},{"category":"Текст","text":"Опиши расставание, не используя слово «любовь»."},{"category":"Текст","text":"Напиши четыре строки о том, что осталось после человека."},{"category":"Текст","text":"Расскажи о чувствах через предмет в комнате."},{"category":"Текст","text":"Вспомни последнее непрочитанное сообщение и сделай из него строчку."},{"category":"Текст","text":"Напиши письмо человеку, которому уже не напишешь."},{"category":"Текст","text":"Придумай название песни из двух обычных слов."},{"category":"Текст","text":"Опиши свою ревность без слова «ревность»."},{"category":"Текст","text":"Напиши припев как короткое признание самому себе."},{"category":"Текст","text":"Расскажи историю одной ночи в восьми строках."},{"category":"Текст","text":"Опиши человека через три маленькие привычки."},{"category":"Текст","text":"Начни куплет с вопроса, на который боишься отвечать."},{"category":"Текст","text":"Напиши четыре строки о дороге домой после ссоры."},{"category":"Текст","text":"Придумай текст, где последняя строка меняет смысл первой."},{"category":"Текст","text":"Напиши песню от лица человека, который ушёл."},{"category":"Текст","text":"Вместо красивых фраз скажи одну неловкую правду."},{"category":"Текст","text":"Опиши пустую квартиру после расставания."},{"category":"Текст","text":"Найди в старой переписке одно обычное слово и сделай его главным."},{"category":"Текст","text":"Напиши строчку, которую стесняешься произнести вслух."},{"category":"Текст","text":"Опиши счастливый день так, будто он уже закончился."},{"category":"Текст","text":"Напиши припев, обращаясь к человеку на «ты»."},{"category":"Текст","text":"Сделай куплет из коротких фраз — не длиннее семи слов."},{"category":"Текст","text":"Расскажи, чего тебе не хватало, когда вы были рядом."},{"category":"Текст","text":"Закончи каждую строчку одним и тем же словом."},{"category":"Текст","text":"Напиши про встречу, которая так и не случилась."},{"category":"Текст","text":"Опиши воспоминание через запах, звук и свет."},{"category":"Текст","text":"Начни с финала истории, а потом объясни, как всё случилось."},{"category":"Текст","text":"Напиши слова, которые хочется услышать от другого человека."},{"category":"Текст","text":"Скажи о боли так, будто разговариваешь с другом."},{"category":"Текст","text":"Придумай строчку, после которой нужна секунда тишины."},{"category":"Текст","text":"Опиши пять минут перед важным звонком."},{"category":"Текст","text":"Напиши про любовь, не упоминая другого человека."},{"category":"Текст","text":"Сделай припев из вопроса и короткого ответа."},{"category":"Текст","text":"Расскажи об одном месте, куда больше не хочется возвращаться."},{"category":"Текст","text":"Поменяй одну слишком сложную строчку на простую и честную."},{"category":"Текст","text":"Опиши фотографию, которую никак не удалишь."},{"category":"Текст","text":"Напиши про надежду, даже если песня грустная."},{"category":"Текст","text":"Сделай историю, в которой никто не виноват."},{"category":"Текст","text":"Придумай первую строчку, которая сразу переносит слушателя в сцену."},{"category":"Мелодия","text":"Напой припев без слов, используя только «а» и «о»."},{"category":"Мелодия","text":"Возьми одну ноту и сделай вокруг неё запоминающийся мотив."},{"category":"Мелодия","text":"Запиши первую мелодию за 60 секунд, не оценивая её."},{"category":"Мелодия","text":"Придумай ответную мелодию на уже готовую фразу."},{"category":"Мелодия","text":"Спой припев почти шёпотом, а потом в полный голос."},{"category":"Мелодия","text":"Сделай мелодию, в которой самая высокая нота звучит один раз."},{"category":"Мелодия","text":"Попробуй начать припев с паузы."},{"category":"Мелодия","text":"Спой одну и ту же фразу тремя разными настроениями."},{"category":"Мелодия","text":"Найди мелодию из трёх нот, которую легко запомнить."},{"category":"Мелодия","text":"Поменяй направление мелодии: вместо подъёма попробуй спуск."},{"category":"Мелодия","text":"Пропой куплет как разговор и поймай естественные ноты."},{"category":"Мелодия","text":"Запиши пять вариантов первой строчки припева подряд."},{"category":"Мелодия","text":"Убери половину нот из своего мотива и послушай результат."},{"category":"Мелодия","text":"Напой мелодию поверх одного аккорда."},{"category":"Мелодия","text":"Сделай последнюю ноту припева неожиданно низкой."},{"category":"Мелодия","text":"Попробуй начать мелодию до первой доли бита."},{"category":"Мелодия","text":"Найди место, где голос может остаться один без инструментов."},{"category":"Мелодия","text":"Придумай короткий мотив, который можно насвистеть."},{"category":"Мелодия","text":"Повтори одну мелодическую фразу, но поменяй только концовку."},{"category":"Мелодия","text":"Спой припев на октаву ниже, чтобы найти другую эмоцию."},{"category":"Мелодия","text":"Сделай мелодию куплета проще, чем хочется."},{"category":"Мелодия","text":"Запиши припев без бита — только голосом."},{"category":"Мелодия","text":"Поставь длинную ноту на самое важное слово."},{"category":"Мелодия","text":"Придумай две мелодии к одним и тем же словам."},{"category":"Мелодия","text":"Спой фразу, будто просишь человека остаться."},{"category":"Мелодия","text":"Попробуй мелодию с одной неожиданной паузой."},{"category":"Мелодия","text":"Сначала напой концовку припева, потом придумай начало."},{"category":"Мелодия","text":"Найди один звук, который хочется повторить после песни."},{"category":"Мелодия","text":"Спой текст в медленном темпе и сохрани лучший изгиб голоса."},{"category":"Мелодия","text":"Возьми знакомый мотив и измени ритм каждой ноты."},{"category":"Мелодия","text":"Пой три минуты без остановки — сохрани одну лучшую секунду."},{"category":"Мелодия","text":"Сделай припев, который легко спеть вместе с залом."},{"category":"Мелодия","text":"Попробуй противопоставить нежную мелодию грустному тексту."},{"category":"Мелодия","text":"Найди место для тихого фальцета в конце фразы."},{"category":"Мелодия","text":"Придумай мелодию, которая начинается с длинной ноты."},{"category":"Аранжировка","text":"Оставь в первом куплете только два инструмента."},{"category":"Аранжировка","text":"Убери барабаны на одну важную строчку."},{"category":"Аранжировка","text":"Сделай интро из звука, который уже есть в комнате."},{"category":"Аранжировка","text":"Поменяй ударные на половине припева и послушай разницу."},{"category":"Аранжировка","text":"Добавь одну тихую деталь, которую слышно только в наушниках."},{"category":"Аранжировка","text":"Начни трек сразу с голоса, без вступления."},{"category":"Аранжировка","text":"Пусть бас впервые появится только в припеве."},{"category":"Аранжировка","text":"Запиши один живой звук вместо очередного плагина."},{"category":"Аранжировка","text":"Сделай переход без райзера — только тишиной."},{"category":"Аранжировка","text":"Убери из бита три дорожки и проверь, стало ли сильнее."},{"category":"Аранжировка","text":"Попробуй пустой последний такт перед припевом."},{"category":"Аранжировка","text":"Продублируй один вокальный слог и сделай из него текстуру."},{"category":"Аранжировка","text":"Создай фон из перевёрнутого хвоста реверберации."},{"category":"Аранжировка","text":"Оставь припев на секунду совсем сухим, без эффектов."},{"category":"Аранжировка","text":"Подложи тихие аккорды под самую эмоциональную фразу."},{"category":"Аранжировка","text":"Сделай второй куплет короче первого."},{"category":"Аранжировка","text":"Придумай финал, в котором остаётся только голос."},{"category":"Аранжировка","text":"Добавь в аранжировку один звук из старой демки."},{"category":"Аранжировка","text":"Поменяй инструмент, который играет главную гармонию."},{"category":"Аранжировка","text":"Придумай два такта без кика и послушай, как возвращается грув."},{"category":"Аранжировка","text":"Сделай бэки только на трёх самых важных словах."},{"category":"Аранжировка","text":"Пусть самый мощный момент песни будет неожиданно тихим."},{"category":"Аранжировка","text":"Запиши простой гитарный перебор вместо ещё одного синта."},{"category":"Аранжировка","text":"Сделай короткое инструментальное дыхание между частями."},{"category":"Аранжировка","text":"Создай контраст: сухой куплет и широкий припев."},{"category":"Аранжировка","text":"Попробуй оставить один аккорд дольше обычного."},{"category":"Аранжировка","text":"Отключи все эффекты и проверь, цепляет ли сама песня."},{"category":"Аранжировка","text":"Спрячь знакомую мелодию в тихом фоне аранжировки."},{"category":"Аранжировка","text":"Поменяй только одну ноту в басовой линии."},{"category":"Аранжировка","text":"Убери вступление и послушай, стало ли интереснее."},{"category":"Действие","text":"Поставь таймер на 10 минут и закончи хотя бы четыре строчки."},{"category":"Действие","text":"Открой самый старый незаконченный проект и найди в нём одну сильную идею."},{"category":"Действие","text":"Запиши демку целиком, даже если половина слов пока случайные."},{"category":"Действие","text":"Выбери один трек и допиши сегодня только припев."},{"category":"Действие","text":"На 15 минут отключи интернет и оставь открытым один проект."},{"category":"Действие","text":"Запиши три варианта припева, не удаляя ни один."},{"category":"Действие","text":"Послушай свою демку на телефоне и запиши первое впечатление."},{"category":"Действие","text":"Назови три эмоции, которые должен почувствовать слушатель."},{"category":"Действие","text":"Составь список из пяти возможных названий альбома."},{"category":"Действие","text":"Отложи сведение: сегодня важны только песня и эмоция."},{"category":"Действие","text":"Возьми самый слабый кусок демки и перепиши только его."},{"category":"Действие","text":"Запиши голосовую заметку о том, что сейчас тревожит."},{"category":"Действие","text":"Выбери одну песню, которую точно хочется закончить первой."},{"category":"Действие","text":"Сделай за 20 минут черновик песни от начала до конца."},{"category":"Действие","text":"Сыграй свою песню под один инструмент и проверь, работает ли она."},{"category":"Действие","text":"Спроси себя: о чём эта песня в одном предложении?"},{"category":"Действие","text":"Удалять ничего не надо: создай отдельную версию и экспериментируй."},{"category":"Действие","text":"Сегодня закончи структуру одного трека без полировки звука."},{"category":"Действие","text":"После каждого дубля записывай, что получилось лучше всего."},{"category":"Действие","text":"Сделай перерыв на пять минут и вернись только к одной задаче."},{"category":"Действие","text":"Представь, что песня выходит завтра: что в ней необходимо закончить?"},{"category":"Действие","text":"Выбери любимые восемь тактов и строй песню вокруг них."},{"category":"Действие","text":"Спой припев близкому человеку без объяснений."},{"category":"Действие","text":"Переслушай четыре своих старых припева и выпиши, что их объединяет."},{"category":"Действие","text":"Составь список песен альбома: готова, в работе, идея."},{"category":"Действие","text":"Не начинай новый бит, пока не запишешь одну демку на готовый."},{"category":"Действие","text":"Открой проект и зафиксируй единственную цель на эту сессию."},{"category":"Действие","text":"Запиши один дубль с выключенным экраном монитора."},{"category":"Действие","text":"Дай черновику рабочее название и сохрани его сегодня."},{"category":"Действие","text":"Закончи сессию, оставив заметку: с чего начать завтра."},{"category":"Неожиданный ход","text":"Удали главный инструмент на восемь тактов. Найди, что теперь держит песню."},{"category":"Неожиданный ход","text":"Сделай припев из самой тихой фразы куплета."},{"category":"Неожиданный ход","text":"Запиши любимую мелодию на октаву ниже и послушай её характер."},{"category":"Неожиданный ход","text":"Поменяй местами начало и конец припева. Какая версия цепляет сильнее?"},{"category":"Неожиданный ход","text":"Возьми случайный бытовой звук и преврати его в ритмически
