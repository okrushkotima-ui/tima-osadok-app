<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b10" />
    <title>РИТМ · Контент</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="../icons/ritm-192.png" />
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <div class="fog"></div>
    <main class="shell">
      <header>
        <a class="small-label" href="../">ТВОЙ ГОЛОС.<br />ТВОЙ ТЕМП.</a>
        <div class="brand">
          РИТМ<span>контент</span><small>тима осадок</small>
        </div>
        <button id="settings" aria-label="Настройки">⚙</button>
      </header>
      <div id="storageNotice" role="alert"></div>
      <nav id="dates" class="dates" aria-label="Выбор дня"></nav>
      <div id="app"></div>
      <footer>
        Снимай живо. Проверяй на своей аудитории.<br />Данные в этом браузере ·
        синхронизации и автопубликации нет.<br />МСК · Europe/Moscow (UTC+3)
      </footer>
    </main>
    <nav class="bottom" aria-label="Разделы">
      <button data-tab="today" aria-label="Сегодня">
        ◉<span>Сегодня</span></button
      ><button data-tab="plan" aria-label="План">▦<span>План</span></button
      ><button data-tab="ideas" aria-label="Идеи">✦<span>Идеи</span></button
      ><button data-tab="trends" aria-label="Тренды">
        ✧<span>Тренды</span></button
      ><button data-tab="stats" aria-label="Статистика">
        ↗<span>Статистика</span>
      </button>
    </nav>
    <dialog id="modal" aria-labelledby="modalTitle">
      <button class="close" aria-label="Закрыть">×</button>
      <div id="modalBody"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="legacy.js?v=4"></script>
    <script src="catalog.js?v=4"></script>
    <script src="strategy.js?v=4"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
